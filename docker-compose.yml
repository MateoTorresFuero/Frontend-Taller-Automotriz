version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taller_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taller_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller-net

  db_mongo:
    image: mongo:6.0
    container_name: taller_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taller-net

  auth-service:
    build:
      context: ./backend
    container_name: auth_service
    command: uvicorn app.main_auth:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/taller_db
      - SECRET_KEY=taller_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
    networks:
      - taller-net

  cliente-service:
    build:
      context: ./backend
    container_name: cliente_service
    command: uvicorn app.main_clientes:app --host 0.0.0.0 --port 8002
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/taller_db
      - SECRET_KEY=taller_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
    networks:
      - taller-net

  ost-service:
    build:
      context: ./backend
    container_name: ost_service
    command: uvicorn app.main_ost:app --host 0.0.0.0 --port 8003
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/taller_db
      - SECRET_KEY=taller_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
    networks:
      - taller-net

  bitacora-service:
    build:
      context: ./backend
    container_name: bitacora_service
    command: uvicorn app.main_bitacora:app --host 0.0.0.0 --port 8004
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/taller_db
      - MONGO_URL=mongodb://db_mongo:27017/taller_db
      - SECRET_KEY=taller_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db_mongo
    networks:
      - taller-net

  gateway:
    image: nginx:alpine
    container_name: taller_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - cliente-service
      - ost-service
      - bitacora-service
    networks:
      - taller-net

volumes:
  postgres_data:
  mongo_data:

networks:
  taller-net:
    driver: bridge
